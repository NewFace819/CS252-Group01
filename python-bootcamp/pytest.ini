[pytest]
# W2-4 files are named tests_for_<reviewee>.py (Section 18.6), which pytest skips by default.
python_files = test_*.py tests_for_*.py
# Every member has a w2/ package; importlib mode stops the same-named packages from clashing.
# Test files therefore import by full path: from members.<folder>.w1.translate import ...
addopts = --import-mode=importlib
pythonpath = .
